<!doctype html>
<html><head><meta charset="utf-8"><title>okay-desk — chat with your data, in the browser</title>
<style>
body{font:15px/1.45 system-ui;max-width:60em;margin:1.5em auto;padding:0 1em;color:#222}
h1{font-size:22px}.bar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:8px 0}.status{color:#555;margin-left:8px}
.tables details{margin:4px 0}.tables pre,.msg pre{white-space:pre-wrap;background:#f5f5f5;padding:8px;border-radius:6px;overflow-x:auto}
.msg{margin:8px 0}.msg.user pre{background:#e8f0fe}.msg.model pre{background:#eef9ee}.msg.system pre{background:#fff6e5;color:#664}
.msg.result pre{background:#f5f5f5}.tables summary{cursor:pointer}.tables button.close{border:none;background:#eee;border-radius:10px;padding:0 7px;cursor:pointer;color:#833}.q{width:70%;padding:8px}footer{margin-top:2em;color:#666;font-size:13px}
</style></head>
<body>
<div id="app"></div>
<script type="module">
  import * as webllm from "https://esm.run/@mlc-ai/web-llm";
  window.webllm = webllm;
</script>
<script src="main.js"></script>
</body></html>
